<!DOCTYPE html>
<html lang="id">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Daftar - JetStar</title>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
		<link rel="stylesheet" href="css/base.css">
		<link rel="stylesheet" href="css/layout-transaksi.css">
	</head>

	<body>
		<div class="auth-wrapper d-flex align-items-center justify-content-center min-vh-100 py-5">
			<div class="auth-card card shadow-lg border-0">
				<div class="card-body p-4 p-md-5">
					<a href="index.html" class="d-block text-center logo-jetstar mb-4 text-decoration-none">
						<i class="bi bi-water"></i> JetStar
					</a>
					<h1 class="h4 fw-bold text-center mb-4">Buat Akun Baru</h1>

					<form action="11-E-dashboard.html" method="get">
						<div class="mb-3">
							<label class="form-label small">Nama Lengkap</label>
							<input type="text" class="form-control" name="nama" required>
						</div>
						<div class="mb-3">
							<label class="form-label small">Email</label>
							<input type="email" class="form-control" name="email" required>
						</div>
						<div class="mb-3">
							<label class="form-label small">Nomor HP</label>
							<input type="tel" class="form-control" name="hp" required>
						</div>
						<div class="mb-3">
							<label class="form-label small">Kata Sandi</label>
							<input type="password" class="form-control" name="password" required>
						</div>
						<div class="mb-3">
							<label class="form-label small">Daftar Sebagai</label>
							<select class="form-select" name="peran">
								<option>Pembeli / Penyewa</option>
								<option>Penjual</option>
							</select>
						</div>
						<div class="form-check mb-4">
							<input class="form-check-input" type="checkbox" id="tncSignup" required>
							<label class="form-check-label small" for="tncSignup">Saya setuju dengan syarat dan ketentuan JetStar.</label>
						</div>
						<button type="submit" class="btn btn-primary text-white w-100">Daftar Sekarang</button>
					</form>

					<p class="text-center small mt-4 mb-0">
						Sudah punya akun?
						<a href="21-N-login.html">Masuk di sini</a>
					</p>
				</div>
			</div>
		</div>
	</body>
</html>
