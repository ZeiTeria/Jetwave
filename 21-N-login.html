<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk - JetWave</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrapper d-flex align-items-center justify-content-center min-vh-100 py-5">
	<div class="auth-card card shadow-lg border-0">
		<div class="card-body p-4 p-md-5">
			<a href="index.html" class="d-block text-center logo-jetwave mb-4 text-decoration-none">
				<i class="bi bi-water"></i>
				JetWave
			</a>
			<h1 class="h4 fw-bold text-center mb-4">
				Silahkan Masukkan Alamat Email & Password
			</h1>

			<form action="11-E-dashboard.html" method="post">
				<div class="mb-3">
					<label class="form-label small">Email</label>
					<input type="email" class="form-control" name="email" placeholder="nama@email.com" required>
				</div>
				<div class="mb-3">
					<label class="form-label small">Kata Sandi</label>
					<input type="password" class="form-control" name="password" required>
				</div>
				<div class="d-flex justify-content-between align-items-center mb-4">
					<div class="form-check">
						<input class="form-check-input" type="checkbox" id="ingat">
						<label class="form-check-label small" for="ingat">
							Ingat saya
						</label>
					</div>
					<a href="23-N-lupa-password.html" class="small">
						Lupa kata sandi?
					</a>
				</div>
				<button type="submit" class="btn btn-primary text-white w-100">
					Masuk
				</button>
			</form>

			<p class="text-center small mt-4 mb-0">
				Belum punya akun?
				<a href="22-N-signup.html">Daftar di sini</a>
			</p>
		</div>
	</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
