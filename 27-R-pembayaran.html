<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pembayaran - JetWave</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="bg-white border-bottom py-3 mb-4">
	<div class="container d-flex justify-content-between align-items-center">
		<a href="index.html" class="logo-jetwave text-decoration-none">
			<i class="bi bi-water"></i>
			JetWave
		</a>
		<a href="index.html" class="small text-decoration-none">
			<i class="bi bi-arrow-left"></i>
			Batalkan
		</a>
	</div>
</header>

<main class="container pb-5">
	<div class="step-indicator">
		<div class="step">
			<span class="num">1</span>
			<br>
			Checkout
		</div>
		<div class="step active">
			<span class="num">2</span>
			<br>
			Pembayaran
		</div>
		<div class="step">
			<span class="num">3</span>
			<br>
			Konfirmasi
		</div>
	</div>

	<div class="row g-4 justify-content-center">
		<div class="col-lg-7">
			<h1 class="h4 fw-bold mb-3">
				Pilih Metode Pembayaran
			</h1>
			<form class="card-jetski p-4" action="28-R-konfirmasi.html" method="get">
				<div class="mb-3">
					<div class="form-check border rounded-3 p-3 mb-2">
						<input class="form-check-input" type="radio" name="metode" id="metodeVa" value="va" checked>
						<label class="form-check-label" for="metodeVa">
							<i class="bi bi-bank me-2"></i>
							Transfer Virtual Account
						</label>
					</div>
					<div class="form-check border rounded-3 p-3 mb-2">
						<input class="form-check-input" type="radio" name="metode" id="metodeKartu" value="kartu">
						<label class="form-check-label" for="metodeKartu">
							<i class="bi bi-credit-card me-2"></i>
							Kartu Debit / Kredit
						</label>
					</div>
					<div class="form-check border rounded-3 p-3">
						<input class="form-check-input" type="radio" name="metode" id="metodeEwallet" value="ewallet">
						<label class="form-check-label" for="metodeEwallet">
							<i class="bi bi-wallet2 me-2"></i>
							E-Wallet
						</label>
					</div>
				</div>

				<div class="row g-3 mb-3">
					<div class="col-md-6">
						<label class="form-label small">Bank / Penyedia</label>
						<select class="form-select" name="bank">
							<option>BCA</option>
							<option>Mandiri</option>
							<option>BNI</option>
							<option>BRI</option>
						</select>
					</div>
					<div class="col-md-6">
						<label class="form-label small">Nomor Rekening/Kartu Pengirim</label>
						<input type="text" class="form-control" name="rekening">
					</div>
				</div>

				<button type="submit" class="btn btn-primary text-white w-100">
					Bayar Sekarang
				</button>
			</form>
		</div>
	</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
