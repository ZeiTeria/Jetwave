<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pembayaran - JetStar</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout-transaksi.css">
</head>
<body>

<header class="bg-white border-bottom py-3 mb-4">
	<div class="container d-flex justify-content-between align-items-center">
		<a href="index.html" class="logo-jetstar text-decoration-none">
			<i class="bi bi-water"></i>
			JetStar
		</a>
		<a href="index.html" class="small text-decoration-none">
			<i class="bi bi-arrow-left"></i>
			Batalkan
		</a>
	</div>
</header>

<main class="container pb-5">
	<div class="step-indicator">
		<div class="step">
			<span class="num">1</span>
			<br>
			Checkout
		</div>
		<div class="step active">
			<span class="num">2</span>
			<br>
			Pembayaran
		</div>
		<div class="step">
			<span class="num">3</span>
			<br>
			Konfirmasi
		</div>
	</div>

	<div class="row g-4 justify-content-center">
		<div class="col-lg-7">
			<h1 class="h4 fw-bold mb-3">
				Pilih Metode Pembayaran
			</h1>
			<form class="card-jetski p-4" action="28-R-konfirmasi.html" method="get" id="formPembayaran">
				<label class="payment-option">
					<input class="form-check-input" type="radio" name="metode" id="metodeVA" value="va" checked>
					<i class="bi bi-bank me-2"></i>
					Transfer Virtual Account
				</label>
				<label class="payment-option">
					<input class="form-check-input" type="radio" name="metode" id="metodeKartu" value="kartu">
					<i class="bi bi-credit-card me-2"></i>
					Kartu Debit / Kredit
				</label>
				<label class="payment-option">
					<input class="form-check-input" type="radio" name="metode" id="metodeEwallet" value="ewallet">
					<i class="bi bi-wallet2 me-2"></i>
					E-Wallet
				</label>

				<div class="payment-panel" id="panel-va">
					<div class="row g-3">
						<div class="col-12">
							<label class="form-label small d-block mb-2">Bank Penerbit VA</label>
							<div class="bank-picker">
								<label class="bank-option">
									<input type="radio" name="va_bank" id="bankBCA" value="BCA" checked>
									BCA
								</label>
								<label class="bank-option">
									<input type="radio" name="va_bank" id="bankMandiri" value="Mandiri">
									Mandiri
								</label>
								<label class="bank-option">
									<input type="radio" name="va_bank" id="bankBNI" value="BNI">
									BNI
								</label>
								<label class="bank-option">
									<input type="radio" name="va_bank" id="bankBRI" value="BRI">
									BRI
								</label>
							</div>
						</div>
						<div class="col-12">
							<label class="form-label small">Nomor Virtual Account</label>
							<div class="va-bank-field" id="vaFieldBCA">
								<div class="va-input-group">
									<span class="va-prefix">70012</span>
									<input type="tel" inputmode="numeric" pattern="[0-9]*" class="form-control" name="va_nomor" placeholder="Nomor HP terdaftar" required>
								</div>
							</div>
							<div class="va-bank-field" id="vaFieldMandiri">
								<div class="va-input-group">
									<span class="va-prefix">88908</span>
									<input type="tel" inputmode="numeric" pattern="[0-9]*" class="form-control" name="va_nomor" placeholder="Nomor HP terdaftar" required>
								</div>
							</div>
							<div class="va-bank-field" id="vaFieldBNI">
								<div class="va-input-group">
									<span class="va-prefix">8808</span>
									<input type="tel" inputmode="numeric" pattern="[0-9]*" class="form-control" name="va_nomor" placeholder="Nomor HP terdaftar" required>
								</div>
							</div>
							<div class="va-bank-field" id="vaFieldBRI">
								<div class="va-input-group">
									<span class="va-prefix">26215</span>
									<input type="tel" inputmode="numeric" pattern="[0-9]*" class="form-control" name="va_nomor" placeholder="Nomor HP terdaftar" required>
								</div>
							</div>
						</div>
					</div>
				</div>

				<div class="payment-panel" id="panel-kartu">
					<div class="row g-3">
						<div class="col-12">
							<label class="form-label small">Nomor Kartu</label>
							<input type="tel" inputmode="numeric" pattern="[0-9 ]*" class="form-control" name="kartu_nomor" placeholder="0000 0000 0000 0000" maxlength="19" required>
						</div>
						<div class="col-md-6">
							<label class="form-label small">Masa Berlaku</label>
							<input type="text" inputmode="numeric" pattern="[0-9]{2}/[0-9]{2}" class="form-control" name="kartu_exp" placeholder="MM/YY" maxlength="5" required>
						</div>
						<div class="col-md-6">
							<label class="form-label small">CVV</label>
							<input type="tel" inputmode="numeric" pattern="[0-9]{3,4}" class="form-control" name="kartu_cvv" placeholder="123" maxlength="3" required>
						</div>
					</div>
				</div>

				<div class="payment-panel" id="panel-ewallet">
					<div class="row g-3">
						<div class="col-md-6">
							<label class="form-label small">Penyedia E-Wallet</label>
							<select class="form-select" name="ewallet_penyedia">
								<option>GoPay</option>
								<option>OVO</option>
								<option>DANA</option>
								<option>ShopeePay</option>
							</select>
						</div>
						<div class="col-md-6">
							<label class="form-label small">Nomor HP</label>
							<input type="tel" inputmode="numeric" pattern="[0-9]*" class="form-control" name="ewallet_nomor" placeholder="08xxxxxxxxxx" maxlength="14" required>
						</div>
					</div>
				</div>

				<button type="submit" class="btn btn-primary text-white w-100 mt-4">
					Bayar Sekarang
				</button>
			</form>
		</div>
	</div>
</main>

</body>
</html>
