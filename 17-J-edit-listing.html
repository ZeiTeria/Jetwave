	<main class="flex-grow-1 p-4">
		<h1 class="h3 fw-bold mb-4">
			Edit Listing: Yamaha WaveRunner VX
		</h1>

		<form class="card-jetski p-4" action="15-J-listing-saya.html" method="post" enctype="multipart/form-data">
			<div class="row g-3">
				<div class="col-md-8">
					<label class="form-label small">Judul Listing</label>
					<input type="text" class="form-control" name="judul" value="Yamaha WaveRunner VX 2021">
				</div>
				<div class="col-md-4">
					<label class="form-label small">Kategori</label>
					<select class="form-select" name="kategori">
						<option selected>Rekreasi</option>
						<option>Sport</option>
						<option>Performa Tinggi</option>
						<option>Touring</option>
					</select>
				</div>

				<div class="col-md-4">
					<label class="form-label small d-block">Tipe Listing</label>
					<div class="form-check form-check-inline">
						<input class="form-check-input" type="radio" name="tipe" id="editJual" checked>
						<label class="form-check-label" for="editJual">Jual</label>
					</div>
					<div class="form-check form-check-inline">
						<input class="form-check-input" type="radio" name="tipe" id="editSewa">
						<label class="form-check-label" for="editSewa">Sewa</label>
					</div>
				</div>
				<div class="col-md-4">
					<label class="form-label small">Harga (Rp)</label>
					<input type="number" class="form-control" name="harga" value="185000000">
				</div>
				<div class="col-md-4">
					<label class="form-label small">Lokasi</label>
					<input type="text" class="form-control" name="lokasi" value="Bali, Indonesia">
				</div>

				<div class="col-12">
					<label class="form-label small">Deskripsi</label>
					<textarea class="form-control" name="deskripsi" rows="4">Jetski rekreasi terawat, service rutin, dokumen lengkap, siap pakai.</textarea>
				</div>

				<div class="col-12">
					<label class="form-label small">Foto Saat Ini</label>
					<div class="d-flex gap-2 mb-2">
						<img src="Img/82_2025_vx1050f-b_wh_na_11_yy_35-large.png" alt="Foto 1" width="80" class="rounded">
						<img src="Img/JETSKI-VYX.jpg" alt="Foto 2" width="80" class="rounded">
					</div>
					<input class="form-control" type="file" name="foto" accept="image/*" multiple>
				</div>
			</div>

			<div class="d-flex gap-2 mt-4">
				<button type="submit" class="btn btn-primary text-white">
					Simpan Perubahan
				</button>
				<a href="15-J-listing-saya.html" class="btn btn-outline-primary">
					Batal
				</a>
			</div>
		</form>
