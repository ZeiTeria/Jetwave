<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beri Ulasan - JetWave</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="bg-white border-bottom py-3 mb-4">
	<div class="container d-flex justify-content-between align-items-center">
		<a href="index.html" class="logo-jetwave text-decoration-none">
			<i class="bi bi-water"></i>
			JetWave
		</a>
		<a href="11-E-dashboard.html" class="small text-decoration-none">
			Ke Dashboard
			<i class="bi bi-arrow-right"></i>
		</a>
	</div>
</header>

<main class="container pb-5">
	<div class="step-indicator">
		<div class="step">
			<span class="num">1</span>
			<br>
			Transaksi
		</div>
		<div class="step">
			<span class="num">2</span>
			<br>
			Selesai
		</div>
		<div class="step active">
			<span class="num">3</span>
			<br>
			Ulasan
		</div>
	</div>

	<div class="row g-4 justify-content-center">
		<div class="col-lg-6">
			<form class="card-jetski p-4" action="11-E-dashboard.html" method="get">
				<div class="d-flex align-items-center gap-3 mb-3">
					<img src="Img/jetski-1.svg" alt="Yamaha WaveRunner VX" width="64" height="64" class="rounded-3">
					<div>
						<h1 class="h6 fw-bold mb-1">
							Yamaha WaveRunner VX
						</h1>
						<p class="small text-muted mb-0">
							Pesanan #JW-1042
						</p>
					</div>
				</div>

				<label class="form-label small d-block">Rating</label>
				<div class="mb-3 fs-4 text-primary">
					<i class="bi bi-star-fill"></i>
					<i class="bi bi-star-fill"></i>
					<i class="bi bi-star-fill"></i>
					<i class="bi bi-star-fill"></i>
					<i class="bi bi-star"></i>
				</div>

				<div class="mb-3">
					<label class="form-label small">Judul Ulasan</label>
					<input type="text" class="form-control" name="judul" placeholder="Contoh: Sesuai deskripsi, mantap!">
				</div>

				<div class="mb-3">
					<label class="form-label small">Ulasan Kamu</label>
					<textarea class="form-control" name="ulasan" rows="4" placeholder="Ceritakan pengalamanmu..."></textarea>
				</div>

				<div class="mb-4">
					<label class="form-label small">Unggah Foto (opsional)</label>
					<input type="file" class="form-control" name="foto" accept="image/*">
				</div>

				<button type="submit" class="btn btn-primary text-white w-100">
					Kirim Ulasan
				</button>
			</form>
		</div>

		<div class="col-lg-6">
			<h2 class="h6 fw-bold mb-3">
				Ulasan Terbaru dari Pengguna Lain
			</h2>
			<ul class="list-unstyled">
				<li class="card-jetski p-3 mb-3">
					<div class="d-flex justify-content-between mb-1">
						<span class="fw-semibold">Dinda Ayu</span>
						<span class="text-primary">
							<i class="bi bi-star-fill"></i>
							<i class="bi bi-star-fill"></i>
							<i class="bi bi-star-fill"></i>
							<i class="bi bi-star-fill"></i>
							<i class="bi bi-star-fill"></i>
						</span>
					</div>
					<p class="small text-muted mb-0">
						Proses sewa cepat, unitnya bersih dan terawat.
					</p>
				</li>
				<li class="card-jetski p-3 mb-3">
					<div class="d-flex justify-content-between mb-1">
						<span class="fw-semibold">Fajar Nugraha</span>
						<span class="text-primary">
							<i class="bi bi-star-fill"></i>
							<i class="bi bi-star-fill"></i>
							<i class="bi bi-star-fill"></i>
							<i class="bi bi-star-fill"></i>
							<i class="bi bi-star"></i>
						</span>
					</div>
					<p class="small text-muted mb-0">
						Bagus, cuma lokasi pengambilan agak jauh dari parkiran.
					</p>
				</li>
			</ul>
		</div>
	</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
