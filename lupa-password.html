<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lupa Kata Sandi - JetWave</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrapper d-flex align-items-center justify-content-center min-vh-100 py-5">
	<div class="auth-card card shadow-lg border-0">
		<div class="card-body p-4 p-md-5">
			<a href="index.html" class="d-block text-center logo-jetwave mb-4 text-decoration-none">
				<i class="bi bi-water"></i>
				JetWave
			</a>
			<h1 class="h4 fw-bold text-center mb-2">
				Lupa Kata Sandi
			</h1>
			<p class="text-muted text-center small mb-4">
				Masukkan email akun kamu, kami akan kirim tautan untuk reset kata sandi.
			</p>

			<form action="login.html" method="post">
				<div class="mb-4">
					<label class="form-label small">Email</label>
					<input type="email" class="form-control" name="email" placeholder="nama@email.com" required>
				</div>
				<button type="submit" class="btn btn-primary text-white w-100">
					Kirim Tautan Reset
				</button>
			</form>

			<p class="text-center small mt-4 mb-0">
				Sudah ingat kata sandi?
				<a href="login.html">Kembali ke Masuk</a>
			</p>
		</div>
	</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
