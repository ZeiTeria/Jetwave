<!DOCTYPE html>
<html lang="id">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Booking Sewa - JetStar</title>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
		<link rel="stylesheet" href="css/base.css">
		<link rel="stylesheet" href="css/layout-transaksi.css">
	</head>

	<body>
		<header class="bg-white border-bottom py-3 mb-4">
			<div class="container d-flex justify-content-between align-items-center">
				<a href="index.html" class="logo-jetstar text-decoration-none">
					<i class="bi bi-water"></i> JetStar
				</a>
				<a href="04-A-sewa.html" class="small text-decoration-none">
					<i class="bi bi-arrow-left"></i> Kembali ke Sewa
				</a>
			</div>
		</header>

		<main class="container pb-5">
			<div class="step-indicator">
				<div class="step active">
					<span class="num">1</span>
					<br>
					Booking
				</div>
				<div class="step">
					<span class="num">2</span>
					<br>
					Checkout
				</div>
				<div class="step">
					<span class="num">3</span>
					<br>
					Pembayaran
				</div>
				<div class="step">
					<span class="num">4</span>
					<br>
					Konfirmasi
				</div>
			</div>

			<div class="row g-4">
				<div class="col-lg-7">
					<h1 class="h4 fw-bold mb-3">Form Booking Sewa</h1>
					<form class="card-jetski p-4" action="26-R-checkout-sewa.html" method="get">
						<div class="row g-3">
							<div class="col-md-6">
								<label class="form-label small">Tanggal Sewa</label>
								<input type="date" class="form-control" name="tanggal" required>
							</div>
							<div class="col-md-6">
								<label class="form-label small">Jam Mulai</label>
								<input type="time" class="form-control" name="jam" required>
							</div>
							<div class="col-md-6">
								<label class="form-label small">Durasi (jam)</label>
								<input type="number" class="form-control" name="durasi" min="1" value="3">
							</div>
							<div class="col-md-6">
								<label class="form-label small">Lokasi Penjemputan</label>
								<select class="form-select" name="lokasi">
									<option>Pantai Ancol, Jakarta</option>
									<option>Nusa Dua, Bali</option>
								</select>
							</div>
							<div class="col-12">
								<label class="form-label small">Catatan Tambahan</label>
								<textarea class="form-control" name="catatan" rows="3" placeholder="Contoh: butuh instruktur pendamping"></textarea>
							</div>
						</div>
						<button type="submit" class="btn btn-primary text-white w-100 mt-4">Lanjut ke Checkout</button>
					</form>
				</div>

				<div class="col-lg-5">
					<div class="card-jetski p-4">
						<img src="Img/OIP.webp" alt="Sea-Doo Spark Trixx" class="img-fluid rounded-3 mb-3">
						<h2 class="h6 fw-bold">Sea-Doo Spark Trixx 2024</h2>
						<p class="text-muted small mb-3">
							<i class="bi bi-geo-alt"></i> Ancol, Jakarta
						</p>
						<div class="table-responsive">
							<table class="table table-sm table-borderless mb-0">
								<tbody>
									<tr>
										<th>Tarif per jam</th>
										<td class="text-end">Rp 450.000</td>
									</tr>
									<tr>
										<th>Durasi</th>
										<td class="text-end">3 jam</td>
									</tr>
									<tr class="border-top">
										<th>Estimasi Total</th>
										<td class="text-end fw-bold text-primary">Rp 1.350.000</td>
									</tr>
								</tbody>
							</table>
						</div>
					</div>
				</div>
			</div>
		</main>
	</body>
</html>
