<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout Pembelian - JetWave</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="bg-white border-bottom py-3 mb-4">
	<div class="container d-flex justify-content-between align-items-center">
		<a href="index.html" class="logo-jetwave text-decoration-none">
			<i class="bi bi-water"></i>
			JetWave
		</a>
		<a href="07-E-detail.html" class="small text-decoration-none">
			<i class="bi bi-arrow-left"></i>
			Kembali ke Detail
		</a>
	</div>
</header>

<main class="container pb-5">
	<div class="step-indicator">
		<div class="step">
			<span class="num">1</span>
			<br>
			Pilih Unit
		</div>
		<div class="step active">
			<span class="num">2</span>
			<br>
			Checkout
		</div>
		<div class="step">
			<span class="num">3</span>
			<br>
			Pembayaran
		</div>
		<div class="step">
			<span class="num">4</span>
			<br>
			Konfirmasi
		</div>
	</div>

	<div class="row g-4">
		<div class="col-lg-7">
			<h1 class="h4 fw-bold mb-3">
				Data Pembeli & Pengiriman
			</h1>
			<form class="card-jetski p-4" action="27-R-pembayaran.html" method="get">
				<div class="row g-3">
					<div class="col-md-6">
						<label class="form-label small">Nama Penerima</label>
						<input type="text" class="form-control" name="nama" required>
					</div>
					<div class="col-md-6">
						<label class="form-label small">Nomor HP</label>
						<input type="tel" class="form-control" name="hp" required>
					</div>
					<div class="col-12">
						<label class="form-label small">Alamat Pengiriman / Pengambilan</label>
						<textarea class="form-control" name="alamat" rows="3" required></textarea>
					</div>
					<div class="col-md-6">
						<label class="form-label small">Metode Pengiriman</label>
						<select class="form-select" name="pengiriman">
							<option>Ambil di lokasi penjual</option>
							<option>Kirim kargo darat</option>
							<option>Kirim kargo laut</option>
						</select>
					</div>
					<div class="col-md-6">
						<label class="form-label small">Kode Promo (opsional)</label>
						<input type="text" class="form-control" name="promo" placeholder="JETWAVE10">
					</div>
					<div class="col-12">
						<div class="form-check">
							<input class="form-check-input" type="checkbox" id="tncBeli" required>
							<label class="form-check-label small" for="tncBeli">
								Saya setuju dengan syarat transaksi JetWave.
							</label>
						</div>
					</div>
				</div>
				<button type="submit" class="btn btn-primary text-white w-100 mt-4">
					Lanjut ke Pembayaran
				</button>
			</form>
		</div>

		<div class="col-lg-5">
			<div class="card-jetski p-4">
				<img src="Img/JETSKI-VYX.jpg" alt="Yamaha WaveRunner VX 2024" class="img-fluid rounded-3 mb-3">
				<h2 class="h6 fw-bold">
					Yamaha WaveRunner VX 2024

				</h2>
				<p class="text-muted small mb-3">
					<i class="bi bi-geo-alt"></i>
					Pantai Kuta, Bali
				</p>
				<div class="table-responsive">
					<table class="table table-sm table-borderless mb-0">
						<tbody>
							<tr>
								<th>Harga Unit</th>
								<td class="text-end">Rp 185.000.000</td>
							</tr>
							<tr>
								<th>Biaya Layanan (10%)</th>
								<td class="text-end">Rp 1.850.000</td>
							</tr>
							<tr>
								<th>Vat (11%)</th>
								<td class="text-end">Rp 22.422.000</td>
							</tr>
							<tr class="border-top">
								<th>Total Pembayaran</th>
								<td class="text-end fw-bold text-primary">Rp 209.272.000</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
