	<body>

			</a>
			<label for="dashboardToggle" class="navbar-toggler">
				<span class="navbar-toggler-icon"></span>
			</label>
		</div>

		<div class="d-flex">
			<label for="dashboardToggle" class="dashboard-overlay d-lg-none"></label>
			<aside class="sidebar-jetstar p-3 d-none d-lg-block">
				<a href="index.html" class="d-block logo-jetstar mb-4 text-decoration-none">
					<i class="bi bi-water"></i> JetStar
				</a>
				<ul class="nav nav-pills flex-column gap-1">
					<li class="nav-item">
						<a class="nav-link" href="11-E-dashboard.html">
							<i class="bi bi-speedometer2 me-2"></i> Dashboard
						</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" href="12-E-profil.html">
							<i class="bi bi-person-circle me-2"></i> Profil
						</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" href="13-J-pesanan.html">
							<i class="bi bi-receipt me-2"></i> Pesanan
						</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" href="14-J-riwayat-sewa.html">
							<i class="bi bi-clock-history me-2"></i> Riwayat Sewa
						</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" href="15-J-listing-saya.html">
							<i class="bi bi-list-ul me-2"></i> Listing Saya
						</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" href="18-J-chat.html">
							<i class="bi bi-chat-dots me-2"></i> Chat
						</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" href="19-N-notifikasi.html">
							<i class="bi bi-bell me-2"></i> Notifikasi

					</li>
					<li class="nav-item">
						<a class="nav-link active" href="20-N-pengaturan.html">
							<i class="bi bi-gear me-2"></i> Pengaturan
						</a>
					</li>
				</ul>
				<hr>
				<a href="index.html" class="nav-link">
					<i class="bi bi-box-arrow-left me-2"></i> Keluar
				</a>
			</aside>

			<main class="flex-grow-1 p-4">
				<h1 class="h3 fw-bold mb-4">Pengaturan Akun</h1>

				<div class="row g-4">
					<div class="col-lg-6">
						<form class="card-jetski p-4 mb-4" action="20-N-pengaturan.html" method="get">
							<h2 class="h6 fw-bold mb-3">Ubah Kata Sandi</h2>
							<div class="mb-3">
								<label class="form-label small">Kata Sandi Lama</label>
								<input type="password" class="form-control" name="lama" required>
							</div>
							<div class="mb-3">
								<label class="form-label small">Kata Sandi Baru</label>
								<input type="password" class="form-control" name="baru" required>
							</div>
							<div class="mb-3">
								<label class="form-label small">Konfirmasi Kata Sandi Baru</label>
								<input type="password" class="form-control" name="konfirmasi" required>
							</div>
							<button type="submit" class="btn btn-primary text-white">Perbarui Kata Sandi</button>
						</form>
					</div>

					<div class="col-lg-6">
						<form class="card-jetski p-4" action="20-N-pengaturan.html" method="get">
							<h2 class="h6 fw-bold mb-3">Preferensi Notifikasi</h2>
							<div class="form-check form-switch mb-2">
								<input class="form-check-input" type="checkbox" id="notifEmail" checked>
								<label class="form-check-label small" for="notifEmail">Notifikasi lewat email</label>
							</div>
							<div class="form-check form-switch mb-2">
								<input class="form-check-input" type="checkbox" id="notifWa" checked>
								<label class="form-check-label small" for="notifWa">Notifikasi lewat WhatsApp</label>
							</div>
							<div class="form-check form-switch mb-4">
								<input class="form-check-input" type="checkbox" id="notifPromo">
								<label class="form-check-label small" for="notifPromo">Terima info promo & penawaran</label>
							</div>

							<h2 class="h6 fw-bold mb-3">Zona Berbahaya</h2>
							<button type="button" class="btn btn-outline-danger btn-sm">Nonaktifkan Akun</button>
						</form>
					</div>
				</div>
			</main>
		</div>
	</body>
