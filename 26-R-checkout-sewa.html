<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout Sewa - JetWave</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="bg-white border-bottom py-3 mb-4">
	<div class="container d-flex justify-content-between align-items-center">
		<a href="index.html" class="logo-jetwave text-decoration-none">
			<i class="bi bi-water"></i>
			JetWave
		</a>
		<a href="24-N-booking.html" class="small text-decoration-none">
			<i class="bi bi-arrow-left"></i>
			Kembali ke Booking
		</a>
	</div>
</header>

<main class="container pb-5">
	<div class="step-indicator">
		<div class="step">
			<span class="num">1</span>
			<br>
			Booking
		</div>
		<div class="step active">
			<span class="num">2</span>
			<br>
			Checkout
		</div>
		<div class="step">
			<span class="num">3</span>
			<br>
			Pembayaran
		</div>
		<div class="step">
			<span class="num">4</span>
			<br>
			Konfirmasi
		</div>
	</div>

	<div class="row g-4">
		<div class="col-lg-7">
			<h1 class="h4 fw-bold mb-3">
				Data Penyewa
			</h1>
			<form class="card-jetski p-4" action="27-R-pembayaran.html" method="get">
				<div class="row g-3">
					<div class="col-md-6">
						<label class="form-label small">Nama Penyewa</label>
						<input type="text" class="form-control" name="nama" required>
					</div>
					<div class="col-md-6">
						<label class="form-label small">Nomor HP</label>
						<input type="tel" class="form-control" name="hp" required>
					</div>
					<div class="col-md-6">
						<label class="form-label small">Nomor SIM / Identitas</label>
						<input type="text" class="form-control" name="identitas" required>
					</div>
					<div class="col-md-6">
						<label class="form-label small">Jumlah Peserta</label>
						<input type="number" class="form-control" name="peserta" min="1" value="1">
					</div>
					<div class="col-12">
						<label class="form-label small">Kebutuhan Tambahan</label>
						<select class="form-select" name="tambahan">
							<option>Tanpa instruktur</option>
							<option>Dengan instruktur pendamping</option>
							<option>Sewa pelampung tambahan</option>
						</select>
					</div>
					<div class="col-12">
						<div class="form-check">
							<input class="form-check-input" type="checkbox" id="tncSewa" required>
							<label class="form-check-label small" for="tncSewa">
								Saya memahami dan menyetujui ketentuan keselamatan sewa JetWave.
							</label>
						</div>
					</div>
				</div>
				<button type="submit" class="btn btn-primary text-white w-100 mt-4">
					Lanjut ke Pembayaran
				</button>
			</form>
		</div>

		<div class="col-lg-5">
			<div class="card-jetski p-4">
				<img src="Img/jetski-2.svg" alt="Sea-Doo Spark Trixx" class="img-fluid rounded-3 mb-3">
				<h2 class="h6 fw-bold">
					Sea-Doo Spark Trixx
				</h2>
				<p class="text-muted small mb-3">
					<i class="bi bi-geo-alt"></i>
					Ancol, Jakarta
				</p>
				<div class="table-responsive">
					<table class="table table-sm table-borderless mb-0">
						<tbody>
							<tr>
								<th>Tarif per jam</th>
								<td class="text-end">Rp 450.000</td>
							</tr>
							<tr>
								<th>Durasi</th>
								<td class="text-end">3 jam</td>
							</tr>
							<tr class="border-top">
								<th>Estimasi Total</th>
								<td class="text-end fw-bold text-primary">Rp 1.350.000</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
